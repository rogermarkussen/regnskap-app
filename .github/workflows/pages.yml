name: Publiser datafrie rapporter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v6

      - name: Sett opp Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            oppgave1/kode/package-lock.json
            oppgave2/kode/package-lock.json
            oppgave3/package-lock.json

      - name: Installer avhengigheter
        run: |
          npm --prefix oppgave1/kode ci
          npm --prefix oppgave2/kode ci
          npm --prefix oppgave3 ci

      - name: Bygg oppgave 1 uten data
        env:
          PUBLIC_BASE: /regnskap-app/oppgave1/
        run: npm --prefix oppgave1/kode run build:public

      - name: Bygg oppgave 2 uten data
        env:
          PUBLIC_BASE: /regnskap-app/oppgave2/
        run: npm --prefix oppgave2/kode run build:public

      - name: Bygg oppgave 3 uten data
        env:
          PUBLIC_BASE: /regnskap-app/oppgave3/
        run: npm --prefix oppgave3 run build:public

      - name: Sett sammen Pages-området
        run: |
          mkdir -p pages-dist/oppgave1 pages-dist/oppgave2 pages-dist/oppgave3
          cp -R pages/. pages-dist/
          cp -R oppgave1/kode/build/. pages-dist/oppgave1/
          cp -R oppgave2/kode/build/. pages-dist/oppgave2/
          cp -R oppgave3/build/. pages-dist/oppgave3/

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp Pages-artefakt
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publiser GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
